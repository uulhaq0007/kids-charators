<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>All Set</title>
    <link
      rel="stylesheet"
      href="style.css" />
  </head>
  <body>
    <h1>All Set!</h1>
    <p>Your personalized book is heading to print!</p>
    <p>
      As soon as it ships, I’ll send you an email with the tracking number so
      you can follow its little journey to your doorstep!
    </p>
    <div class="gratitude">
      Thank you for giving my small shop a chance!<br />
      Your order matters more than you can imagine <span class="emoji">💗</span>
    </div>

    <button class="done-button">DONE</button>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <script src="js/script.js"></script>
  </body>
</html>
