<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Order Check</title>
    <link
      rel="stylesheet"
      href="style.css" />
  </head>
  <body>
    <div class="admin-panel">
      <h1>✨ Admin Panel ✨</h1>
      <h2>📦 Order Check</h2>

      <table id="ordersTable">
        <thead>
          <tr>
            <th>Source</th>
            <th>Order #</th>
            <th>Link Sent</th>
            <th>Personalized</th>
            <th>Address Changed</th>
            <th>Ready PDF</th>
          </tr>
        </thead>
        <tbody>
          <!-- JS will inject rows here -->
        </tbody>
      </table>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <script src="js/script.js"></script>
  </body>
</html>
