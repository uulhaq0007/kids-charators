<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Magic Book Animation</title>
    <link
      rel="stylesheet"
      href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>✨ Making magic... your book cover is nearly ready!</h1>

      <!-- Progress Bar -->
      <div class="progress-bar">
        <div class="progress"></div>
      </div>

      <div class="magic-scene">
        <!-- Magic wand -->
        <img
          src="https://png.pngtree.com/png-vector/20230801/ourmid/pngtree-magic-wand-clipart-an-anime-wand-with-a-bubble-on-it-vector-png-image_6861606.png"
          alt="wand"
          class="wand" />

        <!-- Book -->
        <img
          src="https://cdn-icons-png.flaticon.com/512/2232/2232688.png"
          alt="book"
          class="book" />

        <!-- Static Stars -->
        <div class="star">⭐</div>
        <div class="star">🌟</div>
        <div class="star">✨</div>
        <div class="star">💫</div>

        <!-- Sparkles Container -->
        <div id="sparkles"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
