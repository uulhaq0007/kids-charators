<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Child Hairstyle</title>
    <link
      rel="stylesheet"
      href="style.css" />
  </head>
  <body>
    <div class="card">
      <h2>✨ Please choose child's hairstyle ✨</h2>
      <div class="example-text">
        Example: <br />
        <em>boy’s short blonde straight hair</em> <br />
        <em>girl’s shoulder length black wavy hair</em>
      </div>

      <textarea
        id="hairstyleInput"
        placeholder="Type hairstyle here..."></textarea>

      <button class="btn-submit">Submit</button>
    </div>

    <!-- Toast container -->
    <div class="toast-container"></div>

    <script src="js/script.js"></script>
  </body>
</html>
