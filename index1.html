<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Personalized Storybook</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .storybook-container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 20px 25px;
      width: 350px;
    }

    .storybook-container h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 20px;
      color: #333;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: 500;
      color: #333;
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      margin-top: 6px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .avatar-options, .color-options, .theme-options {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      border: 2px solid #eee;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f4;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .color-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .color-circle.selected {
      border: 2px solid #333;
    }

    .theme-btn {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #ddd;
      cursor: pointer;
      font-size: 13px;
      background: #fff;
    }

    .theme-btn.active {
      background: #e6f0ff;
      border-color: #4a90e2;
      color: #4a90e2;
    }

    .btn-submit {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      background: linear-gradient(to right, #f7c6ff, #cce6ff);
      cursor: pointer;
    }
.name-age{
    display: flex;
    gap: 10px;}
.name{padding:10px;}
  </style>
</head>
<body>
  <div class="storybook-container">
    <h2>Kids Personalized Storybook</h2>
<div class="name-age">
    <div class='name'>
    <label>Child’s Name</label>
    <input type="text" placeholder="Sophie" value="Sophie">
</div>
<div class='age'>
    <label>Age</label>
    <select>
      <option>7</option>
      <option>6</option>
      <option>8</option>
      <option>9</option>
    </select>
</div>
</div >
    <label>Avatar Picker</label>
    <div class="avatar-options">
      <div class="avatar"><img src="https://i.ibb.co/rfsy7Vm/avatar1.png" alt="avatar1"></div>
      <div class="avatar"><img src="https://i.ibb.co/6Zz4T0W/avatar2.png" alt="avatar2"></div>
      <div class="avatar"><img src="https://i.ibb.co/G5LbLLx/avatar3.png" alt="avatar3"></div>
      <div class="avatar"><img src="https://i.ibb.co/YbG7psS/avatar4.png" alt="avatar4"></div>
    </div>

    <label>Avatar Picker</label>
    <div class="color-options">
      <div class="color-circle selected" style="background:#333;"></div>
      <div class="color-circle" style="background:#cce6ff;"></div>
      <div class="color-circle" style="background:#d4fcd4;"></div>
      <div class="color-circle" style="background:#ffe699;"></div>
    </div>

    <label>Theme / Color Scheme</label>
    <div class="theme-options">
      <button class="theme-btn active">🚀 Adventure</button>
      <button class="theme-btn">🌙 Bedtime</button>
      <button class="theme-btn">🐻 Animal Friends</button>
    </div>

    <label>Story Type</label>
    <input type="text" value="With love from Mommy & Daddy">

    <label>Custom Dedication <small>(Max 200 chars)</small></label>
    <textarea rows="2">With love from Mommy & Daddy</textarea>

    <button class="btn-submit">✨ Create My Storybook</button>
  </div>
</body>
</html>
